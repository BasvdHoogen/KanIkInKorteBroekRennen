name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'WebApiKorteBroek/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: WebApiKorteBroek/packages.lock.json

      - name: Restore
        run: dotnet restore WebApiKorteBroek/WebApiKorteBroek.csproj

      - name: Publish
        run: dotnet publish WebApiKorteBroek/WebApiKorteBroek.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: KorteBroekInfo
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
